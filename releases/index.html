<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Release notes — Bottled Marbles</title>
<meta name="description" content="What each TestFlight build of Bottled Marbles changes, newest first. Testers read the notes in the app's Settings menu; this page is the site's copy.">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#18244c;color:#fff;font-family:-apple-system,system-ui,sans-serif}
main{max-width:40rem;margin:0 auto;padding:1.25rem 1rem .75rem}
h1{font-size:1.4rem;margin:0 0 .4rem}
.lead{opacity:.75;font-size:.92rem;line-height:1.4;margin:0 0 1rem}
.langs{display:flex;gap:.4rem;margin:0 0 1rem}
.langs button{font:inherit;font-size:.8rem;padding:.2rem .65rem;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:#18244c;border-color:#fff}
section.rel{margin:0 0 .9rem;padding:.85rem 1rem;background:rgba(255,255,255,.07);border-radius:10px}
section.rel h2{font-size:1rem;margin:0 0 .2rem}
p.meta{margin:0 0 .45rem;font-size:.78rem;opacity:.6}
ul{margin:0;padding-left:1.15rem;font-size:.88rem;line-height:1.45}
li{margin:0 0 .25rem;overflow-wrap:anywhere}
li:last-child{margin-bottom:0}
a{color:#a9c4ff}
p.err,noscript p{opacity:.8;font-size:.88rem;margin:.5rem 0}
footer{max-width:40rem;margin:0 auto;padding:0 1rem 1.5rem;font-size:.78rem;opacity:.6}
</style>
</head>
<body>
<main>
<h1>Release notes</h1>
<p class="lead">What each TestFlight build changes, newest first. Testers read the notes in the app&#x27;s Settings menu; this page is the site&#x27;s copy.</p>
<div class="langs" role="group" aria-label="Language">
<button type="button" data-lang="en" aria-pressed="true">English</button>
<button type="button" data-lang="ko" aria-pressed="false">한국어</button>
</div>
<div id="list"></div>
<p class="err" id="err" hidden>Release notes could not be loaded. <a href="/content/releases.json">View the raw JSON</a></p>
<noscript><p>This page loads its notes from <a href="/content/releases.json">content/releases.json</a> and needs JavaScript to display them.</p></noscript>
</main>
<footer><a href="/">Bottled Marbles</a> · ipe() 2026</footer>
<script>
(function(){
  "use strict";
  var list=document.getElementById('list');
  var err=document.getElementById('err');
  var btns=Array.prototype.slice.call(document.querySelectorAll('.langs button'));
  var lang='en', releases=[];
  function render(){
    list.innerHTML='';
    releases.forEach(function(r){
      var notes=(r.notes&&r.notes[lang])||[];
      var sec=document.createElement('section');sec.className='rel';
      var h=document.createElement('h2');h.textContent=r.version+' · Build '+r.build;
      sec.appendChild(h);
      var meta=[r.date,r.status==='testflight'?'TestFlight':(r.status||'')].filter(Boolean).join(' · ');
      if(meta){var p=document.createElement('p');p.className='meta';p.textContent=meta;sec.appendChild(p)}
      var ul=document.createElement('ul');
      notes.forEach(function(t){var li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
      sec.appendChild(ul);
      list.appendChild(sec);
    });
    btns.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===lang?'true':'false')});
  }
  btns.forEach(function(b){b.addEventListener('click',function(){lang=b.getAttribute('data-lang');render()})});
  var bust=location.search.replace(/^[\?#]/,'');
  fetch('/content/releases.json'+(bust?'?'+bust:''),{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(function(d){releases=d.releases||[];render()})
    .catch(function(){err.hidden=false});
})();
</script>
</body>
</html>
